<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORMA Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --hint: #8e8e93; --red: #ff5252; }
        body { background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 100px; overflow-x: hidden; }
        header { display: flex; justify-content: space-between; padding: 20px; align-items: center; }
        .logo { font-size: 22px; letter-spacing: 5px; font-weight: 300; }
        .section-header { display: flex; justify-content: space-between; padding: 0 20px; margin-top: 20px; }
        .section-header h2 { font-size: 18px; font-weight: 400; margin: 0; }
        
        /* Сетка товаров */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .product-card { background: #f9f9f9; border-radius: 20px; padding: 15px; text-align: center; position: relative; }
        .product-img { font-size: 40px; margin-bottom: 10px; height: 80px; display: flex; align-items: center; justify-content: center; }
        .p-name { font-size: 13px; margin: 5px 0; }
        .p-price { font-size: 14px; font-weight: 600; }

        /* Кнопка сердечка */
        .fav-btn { position: absolute; top: 10px; right: 10px; font-size: 18px; color: #ddd; cursor: pointer; transition: 0.2s; z-index: 10; }
        .fav-btn.active { color: var(--red); }

        /* Навигация */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; flex: 1; }
        .nav-item.active { color: #000; }
        .nav-item div { font-size: 20px; }
        .nav-item p { font-size: 10px; margin: 4px 0 0; }

        /* Поиск и Страницы */
        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #search-input { width: calc(100% - 40px); margin: 20px; padding: 15px; border-radius: 15px; border: 1px solid #eee; outline: none; font-size: 16px; }

        .btn-qty { border:none; background:#eee; border-radius:5px; width:25px; height:25px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">FORMA</div>
        <div style="font-size: 20px;">👜</div>
    </header>

    <main id="main-content">
        <section id="home" class="page active">
            <div class="section-header"><h2>Популярное</h2></div>
            <div id="grid" class="products-grid"></div>
        </section>

        <section id="search" class="page">
            <div class="section-header"><h2>Поиск</h2></div>
            <input type="text" id="search-input" placeholder="Поиск мебели...">
            <div id="search-results" class="products-grid"></div>
        </section>

        <section id="favorites" class="page">
            <div class="section-header"><h2>Избранное</h2></div>
            <div id="fav-grid" class="products-grid"></div>
            <div id="fav-empty" style="text-align: center; padding: 50px; color: var(--hint); display: none;">
                <div style="font-size: 50px; margin-bottom: 10px;">❤️</div>
                <p>Тут пока ничего нет</p>
            </div>
        </section>

        <section id="cart" class="page">
            <div class="section-header"><h2>Корзина</h2></div>
            <div id="cart-items" style="padding: 20px;"></div>
            <div id="cart-empty" style="text-align: center; padding: 50px; color: var(--hint);">
                <div style="font-size: 50px; margin-bottom: 10px;">🛒</div>
                <p>Корзина пуста</p>
            </div>
        </section>

        <section id="profile" class="page" style="text-align: center; padding-top: 40px;">
            <div style="width: 80px; height: 80px; background: #eee; border-radius: 50%; margin: 0 auto 15px; font-size: 40px; display: flex; align-items: center; justify-content: center;">👤</div>
            <h2 id="u-name">Клиент</h2>
            <p id="u-id" style="color: var(--hint);">ID: ---</p>
        </section>
    </main>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="nav('home')"><div>🏠</div><p>Главная</p></div>
        <div class="nav-item" onclick="nav('search')"><div>🔍</div><p>Поиск</p></div>
        <div class="nav-item" onclick="nav('favorites')"><div>❤️</div><p>Лайки</p></div>
        <div class="nav-item" onclick="nav('cart')"><div>🛒</div><p>Корзина</p></div>
        <div class="nav-item" onclick="nav('profile')"><div>👤</div><p>Профиль</p></div>
    </nav>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const products = [
        { id: 'sofa_lund', name: 'Диван Lund', price: 8999000, icon: '🛋️' },
        { id: 'chair_mist', name: 'Кресло Mist', price: 2799000, icon: '🪑' },
        { id: 'bed_scandi', name: 'Кровать Scandi', price: 6499000, icon: '🛏️' },
        { id: 'lamp_nordic', name: 'Лампа Nordic', price: 999000, icon: '💡' },
        { id: 'mirror_arch', name: 'Зеркало Arch', price: 1899000, icon: '🪞' }
    ];

    let cart = {};
    let favorites = {}; // Храним избранное

    function nav(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        
        document.getElementById(pageId).classList.add('active');
        event.currentTarget.classList.add('active');

        if(pageId === 'profile' && tg.initDataUnsafe.user) {
            document.getElementById('u-name').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('u-id').innerText = 'ID: ' + tg.initDataUnsafe.user.id;
        }
        if(pageId === 'cart') renderCart();
        if(pageId === 'favorites') renderFavs();
    }

    function toggleFav(e, id) {
        e.stopPropagation(); // Чтобы не срабатывал клик по карточке (добавление в корзину)
        favorites[id] = !favorites[id];
        tg.HapticFeedback.impactOccurred('medium');
        render('grid', products); // Перерисовываем главную, чтобы обновить сердечки
    }

    function render(containerId, items) {
        const container = document.getElementById(containerId);
        if(!container) return;
        container.innerHTML = '';
        items.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-card';
            div.onclick = () => addToCart(p);
            div.innerHTML = `
                <div class="fav-btn ${favorites[p.id] ? 'active' : ''}" onclick="toggleFav(event, '${p.id}')">❤️</div>
                <div class="product-img">${p.icon}</div>
                <div class="p-name">${p.name}</div>
                <div class="p-price">${p.price.toLocaleString()} сум</div>
            `;
            container.appendChild(div);
        });
    }

    function renderFavs() {
        const favItems = products.filter(p => favorites[p.id]);
        const container = document.getElementById('fav-grid');
        const emptyMsg = document.getElementById('fav-empty');
        
        if(favItems.length > 0) {
            render('fav-grid', favItems);
            emptyMsg.style.display = 'none';
        } else {
            container.innerHTML = '';
            emptyMsg.style.display = 'block';
        }
    }

    function renderCart() {
        const container = document.getElementById('cart-items');
        const emptyMsg = document.getElementById('cart-empty');
        container.innerHTML = '';
        let hasItems = false;
        
        for (let id in cart) {
            if (cart[id] > 0) {
                hasItems = true;
                const p = products.find(prod => prod.id === id);
                const itemDiv = document.createElement('div');
                itemDiv.style = "display: flex; align-items: center; justify-content: space-between; background: #f9f9f9; padding: 15px; border-radius: 15px; margin-bottom: 10px;";
                itemDiv.innerHTML = `
                    <div style="font-size: 24px; margin-right: 15px;">${p.icon}</div>
                    <div style="flex-grow: 1;">
                        <div style="font-size: 14px; font-weight: 600;">${p.name}</div>
                        <div style="font-size: 12px; color: var(--hint);">${p.price.toLocaleString()} сум</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button class="btn-qty" onclick="changeQty('${id}', -1)">-</button>
                        <span>${cart[id]}</span>
                        <button class="btn-qty" onclick="changeQty('${id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            }
        }
        emptyMsg.style.display = hasItems ? 'none' : 'block';
        updateMainButton();
    }

    function addToCart(p) {
        cart[p.id] = (cart[p.id] || 0) + 1;
        tg.HapticFeedback.notificationOccurred('success');
        updateMainButton();
    }

    function changeQty(id, delta) {
        cart[id] = (cart[id] || 0) + delta;
        if (cart[id] < 0) cart[id] = 0;
        renderCart();
    }

    function updateMainButton() {
        let total = 0;
        for (let id in cart) {
            const p = products.find(prod => prod.id === id);
            total += p.price * cart[id];
        }
        if (total > 0) {
            tg.MainButton.setText(`Купить: ${total.toLocaleString()} сум`);
            tg.MainButton.show();
        } else {
            tg.MainButton.hide();
        }
    }

    tg.MainButton.onClick(() => {
        tg.sendData(JSON.stringify({ products: cart, totalPrice: 0 }));
    });

    document.getElementById('search-input').oninput = (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(query));
        render('search-results', filtered);
    };

    render('grid', products);
</script>
</body>
</html>
