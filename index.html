<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORMA Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --hint: #8e8e93; --accent: #f9f9f9; --red: #ff5252; }
        body { background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 100px; overflow-x: hidden; }
        header { display: flex; justify-content: space-between; padding: 20px; align-items: center; }
        .logo { font-size: 22px; letter-spacing: 5px; font-weight: 300; }
        .categories { display: flex; gap: 15px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { text-align: center; min-width: 70px; cursor: pointer; }
        .cat-icon { width: 70px; height: 70px; background: var(--accent); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 8px; border: 1px solid transparent; transition: 0.2s; }
        .cat-item.active .cat-icon { border-color: #000; background: #fff; transform: scale(1.05); }
        .cat-item p { font-size: 11px; margin: 0; }
        .section-header { display: flex; justify-content: space-between; padding: 20px; }
        .section-header h2 { font-size: 18px; font-weight: 400; margin: 0; }
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .product-card { background: var(--accent); border-radius: 25px; padding: 15px; text-align: center; position: relative; cursor: pointer; transition: transform 0.1s; animation: fadeIn 0.3s; }
        .product-card:active { transform: scale(0.95); }
        .product-img { width: 100%; height: 120px; object-fit: cover; border-radius: 15px; margin-bottom: 10px; display: block; }
        .p-name { font-size: 13px; margin: 5px 0; font-weight: 400; }
        .p-price { font-size: 14px; font-weight: 600; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; flex: 1; transition: 0.2s; }
        .nav-item.active { color: #000; }
        .nav-item div { font-size: 22px; }
        .nav-item p { font-size: 10px; margin: 4px 0 0; }
        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .custom-input { width: calc(100% - 30px); margin: 0 15px 15px; padding: 15px; border-radius: 15px; border: 1px solid #eee; outline: none; font-size: 14px; background: var(--accent); font-family: 'Montserrat', sans-serif; box-sizing: border-box; }
        .promo-container { display: flex; gap: 10px; margin: 0 15px 15px; }
        .promo-container input { margin: 0; flex-grow: 1; width: auto; }
        .promo-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 15px; padding: 0 20px; font-family: 'Montserrat', sans-serif; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">FORMA</div>
        <div style="display: flex; gap: 15px;">
            <span onclick="nav('search')" style="cursor:pointer">🔍</span>
            <span onclick="nav('cart')" style="cursor:pointer">👜</span>
        </div>
    </header>

    <main id="main-content">
        <section id="home" class="page active">
            <div class="section-header"><h2>Категории</h2></div>
            <div class="categories">
                <div class="cat-item active" onclick="filterCategory('all', this)"><div class="cat-icon">🌟</div><p>Все</p></div>
                <div class="cat-item" onclick="filterCategory('sofas', this)"><div class="cat-icon">🛋️</div><p>Диваны</p></div>
                <div class="cat-item" onclick="filterCategory('chairs', this)"><div class="cat-icon">🪑</div><p>Кресла</p></div>
                <div class="cat-item" onclick="filterCategory('beds', this)"><div class="cat-icon">🛏️</div><p>Кровати</p></div>
                <div class="cat-item" onclick="filterCategory('mirrors', this)"><div class="cat-icon">🪞</div><p>Зеркала</p></div>
            </div>
            
            <div class="section-header"><h2 id="grid-title">Популярное</h2></div>
            <div id="grid" class="products-grid"></div>
        </section>

        <section id="search" class="page">
            <div class="section-header"><h2>Поиск</h2></div>
            <input type="text" id="search-input" class="custom-input" placeholder="Что вы ищете?" oninput="searchProducts()">
            <div id="search-results" class="products-grid"></div>
        </section>

        <section id="cart" class="page">
            <div class="section-header"><h2>Корзина</h2></div>
            <div id="cart-items" style="padding: 0 20px;"></div>
            
            <div id="checkout-form" style="display: none; padding-top: 10px;">
                <div class="section-header" style="padding-top: 0; padding-bottom: 10px;"><h2>Промокод</h2></div>
                <div class="promo-container">
                    <input type="text" id="promo-input" class="custom-input" placeholder="Введите код">
                    <button class="promo-btn" onclick="applyPromo()">OK</button>
                </div>
                <p id="promo-msg" style="text-align: center; font-size: 12px; margin-top: -5px; margin-bottom: 15px; display: none;"></p>

                <div class="section-header" style="padding-top: 0;"><h2>Детали заказа</h2></div>
                <input type="text" id="order-name" class="custom-input" placeholder="Ваше имя">
                <input type="tel" id="order-phone" class="custom-input" placeholder="Номер телефона (обязательно)">
                <input type="text" id="order-address" class="custom-input" placeholder="Адрес доставки (или Самовывоз)">
            </div>

            <div id="cart-empty" style="text-align: center; padding: 60px 20px; color: var(--hint);">
                <div style="font-size: 60px; margin-bottom: 20px;">🛒</div>
                <p>В корзине пока ничего нет</p>
            </div>
        </section>

        <section id="profile" class="page" style="text-align: center; padding-top: 40px;">
            <div style="width: 100px; height: 100px; background: var(--accent); border-radius: 50%; margin: 0 auto 20px; font-size: 50px; display: flex; align-items: center; justify-content: center;">👤</div>
            <h2 id="u-name">Клиент</h2>
            <p id="u-id" style="color: var(--hint);">ID: ---</p>
        </section>
    </main>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="nav('home', this)"><div>🏠</div><p>Главная</p></div>
        <div class="nav-item" onclick="nav('search', this)"><div>🔍</div><p>Поиск</p></div>
        <div class="nav-item" onclick="nav('cart', this)"><div>🛒</div><p>Корзина</p></div>
        <div class="nav-item" onclick="nav('profile', this)"><div>👤</div><p>Профиль</p></div>
    </nav>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ОБНОВИЛИ ССЫЛКУ НА ЗЕРКАЛО
    const products = [
        { id: 'sofa_lund', name: 'Диван Lund', price: 899, image: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80', category: 'sofas' },
        { id: 'chair_mist', name: 'Кресло Mist', price: 279, image: 'https://images.unsplash.com/photo-1592078615290-033ee584e267?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80', category: 'chairs' },
        { id: 'bed_scandi', name: 'Кровать Scandi', price: 649, image: 'https://images.unsplash.com/photo-1505693314120-0d443867891c?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80', category: 'beds' },
        { id: 'lamp_nordic', name: 'Лампа Nordic', price: 99, image: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80', category: 'lighting' },
        { id: 'mirror_arch', name: 'Зеркало Arch', price: 189, image: 'https://images.unsplash.com/photo-1582582621959-48d27397dc69?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80', category: 'mirrors' }
    ];

    let cart = {};
    let currentCategory = 'all';
    let discount = 0; // Переменная для скидки

    if (tg.initDataUnsafe.user) {
        document.getElementById('order-name').value = tg.initDataUnsafe.user.first_name || '';
    }

    function nav(pageId, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        const targetPage = document.getElementById(pageId);
        if (targetPage) targetPage.classList.add('active');
        if (el) el.classList.add('active');
        
        if(pageId === 'profile' && tg.initDataUnsafe.user) {
            document.getElementById('u-name').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('u-id').innerText = 'ID: ' + tg.initDataUnsafe.user.id;
        }
        if(pageId === 'cart') renderCart();
        if(pageId === 'home') {
            if(currentCategory === 'all') render('grid', products);
            else render('grid', products.filter(p => p.category === currentCategory));
        }
    }

    function filterCategory(cat, el) {
        document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        
        if (cat === 'all') {
            render('grid', products);
            document.getElementById('grid-title').innerText = 'Популярное';
        } else {
            const filtered = products.filter(p => p.category === cat);
            render('grid', filtered);
            document.getElementById('grid-title').innerText = el.innerText;
        }
        tg.HapticFeedback.selectionChanged();
    }

    function searchProducts() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const results = products.filter(p => p.name.toLowerCase().includes(query));
        render('search-results', results);
    }

    function render(containerId, items) {
        const container = document.getElementById(containerId);
        if(!container) return;
        container.innerHTML = '';
        if(items.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:var(--hint); grid-column:span 2;">Ничего не найдено</p>';
            return;
        }
        items.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-card';
            div.setAttribute('onclick', `addToCart('${p.id}')`);
            div.innerHTML = `
                <img src="${p.image}" class="product-img" alt="${p.name}">
                <div class="p-name">${p.name}</div>
                <div class="p-price">$ ${p.price}</div>
            `;
            container.appendChild(div);
        });
    }

    function addToCart(id) {
        cart[id] = (cart[id] || 0) + 1;
        tg.HapticFeedback.notificationOccurred('success');
        updateMainButton();
    }

    function renderCart() {
        const container = document.getElementById('cart-items');
        const emptyMsg = document.getElementById('cart-empty');
        const checkoutForm = document.getElementById('checkout-form');
        container.innerHTML = '';
        let hasItems = false;
        
        for (let id in cart) {
            if (cart[id] > 0) {
                hasItems = true;
                const p = products.find(prod => prod.id === id);
                if (!p) continue;
                const itemDiv = document.createElement('div');
                itemDiv.style = "display: flex; align-items: center; justify-content: space-between; background: #f9f9f9; padding: 15px; border-radius: 20px; margin-bottom: 10px;";
                itemDiv.innerHTML = `
                    <img src="${p.image}" style="width: 50px; height: 50px; border-radius: 10px; object-fit: cover; margin-right: 15px;">
                    <div style="flex-grow: 1;">
                        <div style="font-size: 14px; font-weight: 600;">${p.name}</div>
                        <div style="font-size: 12px; color: var(--hint);">$ ${p.price}</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button onclick="changeQty('${id}', -1)" style="border:none; background:#ddd; border-radius:5px; width:25px; height:25px;">-</button>
                        <span>${cart[id]}</span>
                        <button onclick="changeQty('${id}', 1)" style="border:none; background:#ddd; border-radius:5px; width:25px; height:25px;">+</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            }
        }
        
        if (hasItems) {
            emptyMsg.style.display = 'none';
            checkoutForm.style.display = 'block';
        } else {
            emptyMsg.style.display = 'block';
            checkoutForm.style.display = 'none';
            discount = 0; // Сбрасываем скидку, если корзина пуста
            document.getElementById('promo-msg').style.display = 'none';
        }
        
        updateMainButton();
    }

    function changeQty(id, delta) {
        cart[id] = (cart[id] || 0) + delta;
        if (cart[id] < 0) cart[id] = 0;
        renderCart();
    }

    // ЛОГИКА ПРОМОКОДА
    function applyPromo() {
        const code = document.getElementById('promo-input').value.trim().toUpperCase();
        const msg = document.getElementById('promo-msg');
        
        if (code === 'FORMA10') {
            discount = 0.10; // Скидка 10%
            msg.style.color = 'green';
            msg.innerText = 'Скидка 10% применена!';
            tg.HapticFeedback.notificationOccurred('success');
        } else {
            discount = 0;
            msg.style.color = 'var(--red)';
            msg.innerText = 'Неверный промокод';
            tg.HapticFeedback.notificationOccurred('error');
        }
        msg.style.display = 'block';
        updateMainButton(); // Пересчитываем сумму
    }

    function updateMainButton() {
        let total = 0;
        for (let id in cart) {
            const p = products.find(prod => prod.id === id);
            if(p) total += p.price * cart[id];
        }
        if (total > 0) {
            // Применяем скидку
            let finalTotal = total - (total * discount);
            tg.MainButton.setText(`Оформить заказ: $ ${finalTotal.toFixed(2)}`);
            tg.MainButton.show();
        } else {
            tg.MainButton.hide();
        }
    }

    tg.MainButton.onClick(() => {
        const phone = document.getElementById('order-phone').value.trim();
        const address = document.getElementById('order-address').value.trim() || 'Самовывоз';
        const name = document.getElementById('order-name').value.trim() || 'Не указано';

        if (!phone) {
            tg.showAlert("Пожалуйста, укажите контактный номер телефона для связи.");
            return;
        }

        let total = 0;
        for (let id in cart) {
            const p = products.find(prod => prod.id === id);
            if(p) total += p.price * cart[id];
        }
        
        let finalTotal = total - (total * discount);
        
        const dataToSend = {
            products: cart,
            totalPrice: finalTotal, // Отправляем боту сумму уже со скидкой!
            customerName: name,
            customerPhone: phone,
            deliveryAddress: address
        };
        
        tg.sendData(JSON.stringify(dataToSend));
    });

    render('grid', products);
</script>
</body>
</html>
