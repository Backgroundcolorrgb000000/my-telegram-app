<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORMA Furniture Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #a89486; /* Бежево-коричневый тон как в дизайне */
            --sec-bg: #f8f8f8;
            --hint: #8e8e93;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 80px; /* Место под нижнее меню */
        }

        /* Шапка с логотипом */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #fff;
        }

        .logo {
            font-size: 22px;
            letter-spacing: 4px;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* Баннер "Новая коллекция" */
        .hero-banner {
            margin: 0 20px 25px 20px;
            height: 200px;
            background: #f0edea;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-banner h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: var(--hint);
        }

        .hero-banner h1 {
            font-size: 32px;
            margin: 10px 0;
            font-weight: 400;
        }

        .hero-banner p {
            font-size: 13px;
            color: var(--hint);
            margin: 0;
        }

        /* Категории (горизонтальный скролл) */
        .section-header {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }

        .categories {
            display: flex;
            overflow-x: auto;
            padding: 0 20px;
            gap: 15px;
            scrollbar-width: none;
            margin-bottom: 30px;
        }

        .categories::-webkit-scrollbar { display: none; }

        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }

        .cat-icon {
            width: 60px;
            height: 60px;
            background: var(--sec-bg);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 8px;
            border: 1px solid transparent;
        }

        .cat-item.active .cat-icon {
            border-color: var(--text-color);
            background: #fff;
        }

        .cat-item span { font-size: 11px; color: var(--hint); }

        /* Сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 0 20px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-img-container {
            position: relative;
            background: var(--sec-bg);
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 0.85 / 1;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-new {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #fff;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 700;
        }

        .btn-add-mini {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--text-color);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: none;
        }

        .product-info { margin-top: 10px; }
        .product-title { font-size: 14px; margin: 0; font-weight: 400; }
        .product-price { font-size: 15px; font-weight: 700; margin: 5px 0; }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
        }

        .nav-item { text-align: center; color: var(--hint); font-size: 20px; }
        .nav-item.active { color: var(--text-color); }
        .nav-item p { font-size: 10px; margin: 5px 0 0 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo">FORMA</div>
        <div style="font-size: 20px;">🔍</div>
    </header>

    <div class="hero-banner">
        <h2>Новая коллекция</h2>
        <h1>Весна 2025</h1>
        <p>Натуральные материалы<br>Скандинавский стиль</p>
    </div>

    <div class="section-header">Категории</div>
    <div class="categories">
        <div class="cat-item active"><div class="cat-icon">🛋</div><span>Все</span></div>
        <div class="cat-item"><div class="cat-icon">🪑</div><span>Кресла</span></div>
        <div class="cat-item"><div class="cat-icon">🛏</div><span>Кровати</span></div>
        <div class="cat-item"><div class="cat-icon">🪞</div><span>Зеркала</span></div>
        <div class="cat-item"><div class="cat-icon">💡</div><span>Свет</span></div>
    </div>

    <div class="section-header">Популярное</div>
    <div id="item-list" class="products-grid"></div>

    <div class="bottom-nav">
        <div class="nav-item active">🏠<p>Главная</p></div>
        <div class="nav-item">🔍<p>Поиск</p></div>
        <div class="nav-item">❤️<p>Избранное</p></div>
        <div class="nav-item">🛒<p>Корзина</p></div>
        <div class="nav-item">👤<p>Профиль</p></div>
    </div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const products = [
    { id: 'sofa_lund', name: 'Диван Lund', price: 89990, img: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400', tag: 'NEW' },
    { id: 'chair_mist', name: 'Кресло Mist', price: 27990, img: 'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=400', tag: '-20%' },
    { id: 'bed_scandi', name: 'Кровать Scandi', price: 64990, img: 'https://images.unsplash.com/photo-1505693419173-42b92568f01a?w=400', tag: '' },
    { id: 'mirror_arch', name: 'Зеркало Arch', price: 18990, img: 'https://images.unsplash.com/photo-1618220179428-22790b461013?w=400', tag: 'LIMITED' }
];

let cart = {};

function renderProducts() {
    const list = document.getElementById('item-list');
    list.innerHTML = '';
    products.forEach(p => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'product-card';
        itemDiv.innerHTML = `
            <div class="product-img-container">
                ${p.tag ? `<div class="badge-new">${p.tag}</div>` : ''}
                <img src="${p.img}" class="product-img">
                <button class="btn-add-mini" onclick="addToCart('${p.id}')">+</button>
            </div>
            <div class="product-info">
                <p class="product-title">${p.name}</p>
                <p class="product-price">${p.price.toLocaleString()} сум</p>
            </div>
        `;
        list.appendChild(itemDiv);
    });
}

function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    tg.HapticFeedback.impactOccurred('medium');
    updateMainButton();
}

function updateMainButton() {
    let total = 0;
    for (const id in cart) {
        const p = products.find(prod => prod.id === id);
        total += p.price * cart[id];
    }
    if (total > 0) {
        tg.MainButton.setText(`Перейти в корзину: ${total.toLocaleString()} сум`);
        tg.MainButton.show();
        tg.MainButton.setParams({ color: '#1a1a1a' });
    } else {
        tg.MainButton.hide();
    }
}

tg.MainButton.onClick(() => {
    // В этом дизайне мы можем добавить ввод данных во всплывающем окне или отдельной странице
    tg.showPopup({
        title: 'Оформление',
        message: 'Для завершения введите адрес в чате или заполните профиль.',
        buttons: [{type: 'ok'}]
    });
    
    const orderData = { products: cart, totalPrice: 0 };
    for (const id in cart) {
        const p = products.find(prod => prod.id === id);
        orderData.totalPrice += p.price * cart[id];
    }
    tg.sendData(JSON.stringify(orderData));
});

renderProducts();
</script>
</body>
</html>
