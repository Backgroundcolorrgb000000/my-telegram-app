<div class="section-header" style="padding-top: 0;"><h2>Детали заказа</h2></div>
<input type="text" id="order-name" class="custom-input" placeholder="Имя" readonly> <div style="position: relative;">
    <input type="tel" id="order-phone" class="custom-input" placeholder="+998 (__) ___-__-__" maxlength="19">
</div>

<div style="position: relative; display: flex; flex-direction: column;">
    <input type="text" id="order-address" class="custom-input" placeholder="Адрес доставки">
    <button onclick="getLocation()" id="loc-btn" style="margin: -5px 15px 15px; background: #eee; border: none; padding: 10px; border-radius: 10px; font-size: 12px; cursor: pointer;">
        📍 Прикрепить мою локацию
    </button>
</div>

<script>
    // 1. МАСКА ТЕЛЕФОНА (Узбекистан)
    const phoneInput = document.getElementById('order-phone');
    phoneInput.addEventListener('input', (e) => {
        let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
        if (!x[1]) { e.target.value = '+998 '; return; }
        if (!e.target.value.startsWith('+998')) { e.target.value = '+998 ' + e.target.value.replace('+998', ''); }
        
        e.target.value = !x[3] ? `+${x[1]} ${x[2]}` : `+${x[1]} (${x[2]}) ${x[3]}` + (x[4] ? `-${x[4]}` : '') + (x[5] ? `-${x[5]}` : '');
    });

    // При фокусе на пустое поле сразу ставим префикс
    phoneInput.addEventListener('focus', (e) => {
        if (!e.target.value) e.target.value = '+998 ';
    });

    // 2. ФУНКЦИЯ ГЕОЛОКАЦИИ
    function getLocation() {
        const btn = document.getElementById('loc-btn');
        btn.innerText = "⏳ Определение...";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                document.getElementById('order-address').value = mapLink;
                btn.innerText = "✅ Локация добавлена";
                btn.style.color = "green";
                tg.HapticFeedback.notificationOccurred('success');
            }, (error) => {
                btn.innerText = "❌ Ошибка доступа";
                tg.showAlert("Пожалуйста, разрешите доступ к геолокации в настройках Telegram");
            });
        } else {
            tg.showAlert("Геолокация не поддерживается вашим устройством");
        }
    }

    // 3. ВАЛИДАЦИЯ ПЕРЕД ОТПРАВКОЙ (внутри tg.MainButton.onClick)

        tg.showAlert("Введите полный номер телефона (12 цифр)");
        return;
    }
    */
</script>
