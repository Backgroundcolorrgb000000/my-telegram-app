<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORMA Furniture Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #d4a373;
            --sec-bg: #fdfaf7;
            --hint: #8e8e93;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding-bottom: 120px;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            align-items: center;
        }

        .logo { font-size: 22px; letter-spacing: 5px; font-weight: 300; }

        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-top: 25px; margin-bottom: 15px; }
        .section-header h2 { font-size: 18px; font-weight: 400; margin: 0; }
        .view-all { font-size: 12px; color: var(--hint); }

        /* КАТЕГОРИИ */
        .categories { display: flex; overflow-x: auto; padding: 0 20px; gap: 15px; margin-bottom: 20px; scrollbar-width: none; }
        .cat-item { display: flex; flex-direction: column; align-items: center; min-width: 75px; }
        .cat-icon { width: 70px; height: 70px; background: #f8f8f8; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; border: 1px solid transparent; }
        .cat-item.active .cat-icon { border-color: #000; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .cat-item span { font-size: 11px; color: var(--text-color); }

        /* СЕТКА ТОВАРОВ */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 20px; }
        .product-card { position: relative; }
        .product-img-box { width: 100%; aspect-ratio: 1; background: #f8f8f8; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; position: relative; }
        .badge { position: absolute; top: 10px; left: 10px; background: #fff; padding: 4px 8px; border-radius: 8px; font-size: 9px; font-weight: 600; }
        .fav-icon { position: absolute; top: 10px; right: 10px; font-size: 18px; color: #eee; }
        .fav-icon.active { color: #ff5252; }
        .p-name { font-size: 13px; font-weight: 400; margin: 0; }
        .p-price { font-size: 15px; font-weight: 600; margin: 5px 0; }

        /* НАВИГАЦИЯ */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; z-index: 100; }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: #000; }
        .nav-item div { font-size: 20px; }
        .nav-item p { font-size: 9px; margin: 4px 0 0 0; }

        /* СЕКЦИИ ПРОФИЛЯ И ПОИСКА */
        .promo-banner { margin: 0 20px 30px 20px; background-color: #fdf2f0; border-radius: 25px; padding: 25px; display: flex; align-items: center; position: relative; }
        .promo-img { font-size: 50px; position: absolute; right: 20px; top: 20px; }
        
        #search-input { 
            width: 90%; margin: 0 auto; display: block; padding: 15px; 
            border-radius: 15px; border: 1px solid #eee; 
            font-family: inherit; font-size: 16px; outline: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FORMA</div>
        <div style="font-size: 20px; display: flex; gap: 15px;"><span>🔍</span><span>👜</span></div>
    </header>

    <main id="content">
        
        <section id="page-home" class="page">
            <div class="section-header">
                <h2>Категории</h2>
                <div class="view-all">Все ➔</div>
            </div>
            
            <div class="categories">
                <div class="cat-item active"><div class="cat-icon">🛋️</div><span>Диваны</span></div>
                <div class="cat-item"><div class="cat-icon">🪑</div><span>Кресла</span></div>
                <div class="cat-item"><div class="cat-icon">🛏️</div><span>Кровати</span></div>
                <div class="cat-item"><div class="cat-icon">🪞</div><span>Зеркала</span></div>
            </div>

            <div class="section-header"><h2>Популярное</h2></div>
            <div class="products-grid" id="grid"></div>

            <div class="section-header"><h2>Спецпредложение</h2></div>
            <div class="promo-banner">
                <div style="width: 70%">
                    <h2 style="font-size: 18px; margin: 0;">Скидка 15% на гостиные</h2>
                </div>
                <div class="promo-img">🛋️</div>
            </div>
        </section>

        <section id="page-search" class="page" style="display: none;">
            <div class="section-header
